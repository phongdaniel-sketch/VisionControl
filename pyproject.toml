[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visioncontrol"
version = "1.0.0"
description = "Local-first two-hand webcam mouse and gesture controller"
requires-python = ">=3.11"

[project.scripts]
visioncontrol = "vision_control.app:main"
visioncontrol-settings = "vision_control.settings_ui:main"
visioncontrol-launcher = "vision_control.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
